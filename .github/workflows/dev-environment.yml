name: Development Environment CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  dev-deploy:
    runs-on: self-hosted
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up environment variables and memory optimization
      run: |
        echo "Setting up environment for development deployment..."
        echo "COMPOSE_PROJECT_NAME=blocomanager" >> $GITHUB_ENV
        echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
        
        # Check available memory
        echo "📊 System Memory Info:"
        free -h
        echo "💾 Available disk space:"
        df -h /
        
        # Check if we have docker group permissions
        echo "🔧 Checking Docker permissions..."
        groups
        
        # Set Docker environment variables for memory optimization
        echo "DOCKER_CLI_EXPERIMENTAL=enabled" >> $GITHUB_ENV
        echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV

    - name: Aggressive cleanup for memory conservation
      run: |
        echo "🧹 Aggressive cleanup for memory conservation..."
        
        # Stop and remove all containers
        docker stop $(docker ps -aq) 2>/dev/null || true
        docker rm $(docker ps -aq) 2>/dev/null || true
        
        # Remove all unused images, containers, networks, and build cache
        docker system prune -af --volumes || true
        
        # Remove dangling images
        docker image prune -af || true
        
        # Clean build cache
        docker builder prune -af || true
        
        # Show memory after cleanup
        echo "📊 Memory after cleanup:"
        free -h

    - name: Memory-optimized build and deploy
      env:
        # Security: Pass environment variables directly to containers, no .env files
        MONGO_DB_CONNECTION_STRING: ${{ secrets.MONGO_DB_CONNECTION_STRING }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PAYMENT_SUCCESS_WEBHOOK_SECRET_KEY: ${{ secrets.STRIPE_PAYMENT_SUCCESS_WEBHOOK_SECRET_KEY }}
        NYLAS_MAIN_ACCOUNT_EMAIL: ${{ vars.NYLAS_MAIN_ACCOUNT_EMAIL }}
        NYLAS_MAIN_ACCOUNT_API_KEY: ${{ secrets.NYLAS_MAIN_ACCOUNT_API_KEY }}
        NYLAS_MAIN_ACCOUNT_GRANT_ID: ${{ secrets.NYLAS_MAIN_ACCOUNT_GRANT_ID }}
        CREATE_MEETING_URL: ${{ vars.CREATE_MEETING_URL }}
        NODE_ENV: development
        PORT: 3002
        DOCKER_ENV: true
      run: |
        echo "🚀 Building and deploying services with Docker Compose..."
        
        # Monitor memory before build
        echo "📊 Memory before build:"
        free -h
        
        # Build and start services using Docker Compose only
        echo "🏗️ Building and starting services with Docker Compose..."
        docker compose --profile dev up -d --build
        
        echo "📊 Memory after build:"
        free -h
        
        echo "✅ Services started"

    - name: Wait for services and health check
      env:
        # Same environment variables for consistency
        MONGO_DB_CONNECTION_STRING: ${{ secrets.MONGO_DB_CONNECTION_STRING }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PAYMENT_SUCCESS_WEBHOOK_SECRET_KEY: ${{ secrets.STRIPE_PAYMENT_SUCCESS_WEBHOOK_SECRET_KEY }}
        NYLAS_MAIN_ACCOUNT_EMAIL: ${{ vars.NYLAS_MAIN_ACCOUNT_EMAIL }}
        NYLAS_MAIN_ACCOUNT_API_KEY: ${{ secrets.NYLAS_MAIN_ACCOUNT_API_KEY }}
        NYLAS_MAIN_ACCOUNT_GRANT_ID: ${{ secrets.NYLAS_MAIN_ACCOUNT_GRANT_ID }}
        CREATE_MEETING_URL: ${{ vars.CREATE_MEETING_URL }}
        NODE_ENV: development
        PORT: 3002
        DOCKER_ENV: true
      run: |
        echo "⏳ Waiting for services to be ready..."
        sleep 30
        
        echo "📋 Container status:"
        docker compose ps
        
        echo "📝 Recent logs:"
        docker compose logs --tail=50
        
        echo "🩺 Health check..."
        curl -f http://localhost:3002/health || exit 1
        
        echo "✅ All services are healthy!"

    - name: Display service information
      run: |
        echo "🎯 Service Information:"
        echo "API URL: http://localhost:3002"
        echo "API Documentation: http://localhost:3002/api-docs"
        echo "MongoDB: mongodb://localhost:27020"
        
        echo "📊 Final memory usage:"
        free -h
        
        echo "🐳 Running containers:"
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"