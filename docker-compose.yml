services:
  # Development MongoDB (for local development)
  mongodb-dev:
    image: mongo:7.0
    container_name: blocomanager_mongodb_dev
    restart: unless-stopped
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_root
      MONGO_INITDB_ROOT_PASSWORD: admin_root
      MONGO_INITDB_DATABASE: blocomanager
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - blocomanager_network
    profiles:
      - dev

  # Development server (for local development)
  nestjs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blocomanager_dev
    ports:
      - "3002:3002"
    env_file: 
      - env/dev.env
      - env/deploy.env  # This file is created during CI/CD, ignored if doesn't exist
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb-dev
    networks:
      - blocomanager_network
    profiles:
      - dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  blocomanager_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_dev_data:
    driver: local
