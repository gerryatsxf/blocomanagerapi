services:
  # API server — environment driven by ENV_TAG (dev, prod, staging)
  nestjs-api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
    image: blocomanager-api:${ENV_TAG:-dev}
    container_name: blocomanager_api_${ENV_TAG:-dev}
    expose:
      - "3002"
    # On remote: blococloud uploads merged .env to ~/deploy/
    # Locally: use --env-file env/dev.env or symlink .env → env/dev.env
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3002}
      - DOCKER_ENV=true
      - NODE_OPTIONS=--max-old-space-size=256
    networks:
      - blocomanager_network
    restart: unless-stopped
    # Resource limits for memory conservation
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Reverse proxy — automatic HTTPS via Let's Encrypt
  caddy:
    image: caddy:2-alpine
    container_name: blocomanager_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # TLS certs
      - caddy_config:/config  # runtime config
    networks:
      - blocomanager_network
    depends_on:
      nestjs-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  caddy_data:
  caddy_config:

networks:
  blocomanager_network:
    driver: bridge


